services:
  web:
    image: odoo:17
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - ./meta_repair_system:/mnt/extra-addons
      - odoo-data:/var/lib/odoo
    restart: always

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: always

volumes:
  odoo-data:
  db-data:
